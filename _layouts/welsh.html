<!DOCTYPE html>
<html lang="cy">
<head>
  <meta charset="utf-8">
  <title>{{ page.title | default: "Andrew Lewis | Cyfansoddwr" }}</title>

  <meta name="description" content="Andrew Lewis, Cyfansoddwr">
  <meta property="og:site_name" content="Andrew Lewis, Cyfansoddwr">
  <meta property="og:title" content="Andrew Lewis - Cyfansoddwr">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="/css/ALstyle26.css?v=06" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Open+Sans" rel="stylesheet" type="text/css">
  <link href="/css/language-selector.css" rel="stylesheet">

</head>

<body>
  <div class="wrapper">
    {% include cy/site_title.html %}
    {% include cy/menu.html %}
    {% if page.scripts %}
  {% for src in page.scripts %}
    <script src="{{ src | relative_url }}"></script>
  {% endfor %}
{% endif %}

    <hr>

    {{ content }}

    <div class="footer_wrapper">{% include cy/footer.html %}</div>
    <div class="stretch">&nbsp;</div>
          <!-- -- This is a hack to stretch the containing white area around the floated columns ----> </div>

  </div>

  <script src="/js/jquery-1.7.2.js"></script>
  
<script>
(function () {
  var selector = document.querySelector('.language-selector');
  document.addEventListener('click', function (event) { if (!selector.contains(event.target)) selector.open = false; });
  document.addEventListener('keydown', function (event) { if (event.key === 'Escape' && selector.open) { selector.open = false; selector.querySelector('summary').focus(); } });
})();
</script>
</body>
</html>
